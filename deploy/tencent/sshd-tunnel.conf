# 独立隧道用户只能建立指定地址的反向转发，不提供交互式会话。
Match User yugitalk-tunnel
    AuthenticationMethods publickey
    PasswordAuthentication no
    AllowTcpForwarding remote
    PermitListen 127.0.0.1:18080
    GatewayPorts no
    MaxSessions 0
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
Match all
