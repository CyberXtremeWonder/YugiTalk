# 本机同时接收本地 HTTP 请求与云端 HTTPS 经 SSH 转发的请求。
map $http_x_forwarded_proto $session_cookie_security {
    default nosecure;
    https secure;
}
map $http_x_forwarded_proto $original_scheme {
    default $scheme;
    https https;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 21m;
    access_log off;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'none'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_endpoint http://api:8000;
    location / { try_files $uri $uri/ /index.html; }
    location /internal/ { return 404; }
    location /health/ {
        proxy_pass $api_endpoint;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass $api_endpoint;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        # 云端 HTTPS 演示时给会话 Cookie 增加安全标志。
        proxy_cookie_flags ~ $session_cookie_security httponly samesite=lax;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
    }
}
