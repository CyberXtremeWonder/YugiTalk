# 生产 HTTPS 入口复用非 root 前端镜像，API 与静态文件保持同源。
server {
    listen 8080;
    server_name _;
    return 308 __PUBLIC_ORIGIN__$request_uri;
}
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/yugitalk/tls/fullchain.pem;
    ssl_certificate_key /etc/yugitalk/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 21m;
    client_header_timeout 10s;
    client_body_timeout 30s;
    # 日志不记录 URL、查询参数、请求正文、Cookie 或认证头。
    access_log off;
    error_log /dev/stderr warn;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header X-Accel-Buffering no always;
    # 回复图片由组件阻断；浏览器策略再禁止同源、外部和 data 图片旁路。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'none'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_endpoint http://api:8000;
    location / { try_files $uri $uri/ /index.html; }
    location /health/ {
        proxy_pass $api_endpoint;
        proxy_set_header Host $host;
    }
    location /internal/ { return 404; }
    location /api/ {
        proxy_pass $api_endpoint;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        proxy_send_timeout 30s;
    }
}
