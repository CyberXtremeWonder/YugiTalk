# 通知通过可选Alertmanager接入；生成和启用步骤见docs/ALERTING.md。
groups:
  - name: yugitalk
    rules:
      - alert: YugiTalkApiUnavailable
        expr: up{job="yugitalk-api"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "API 指标抓取连续失败"}
      - alert: YugiTalkHttpErrors
        expr: sum(rate(yugitalk_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(yugitalk_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "API 五分钟错误率超过百分之五"}
      - alert: YugiTalkQueueStalled
        expr: max(yugitalk_queue_oldest_seconds) > 300
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "最老排队任务等待超过五分钟且持续两分钟"}
      - alert: YugiTalkTaskFailures
        # 当前保留任务的十五分钟窗口快照；不能对该Gauge使用rate或increase。
        expr: max(yugitalk_recent_runs{status="failed"}) >= 5 and max(yugitalk_recent_runs{status="failed"}) / clamp_min(max(yugitalk_recent_runs{status="failed"}) + max(yugitalk_recent_runs{status="succeeded"}), 1) > 0.2
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "十五分钟窗口至少五个任务失败且失败率超过百分之二十"}
