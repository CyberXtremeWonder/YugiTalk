# 临时验收环境只启动应用，依赖复用开发服务，业务数据放在随机独立数据库。
name: yugitalk-stage2-test
services:
  api:
    image: yugitalk-backend:0.1.0
    init: true
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      APP_ENV: test
      DATABASE_URL: ${STAGE2_DATABASE_URL:?由验收脚本生成}
      SESSION_SECRET: ${STAGE2_SESSION_SECRET:?由验收脚本生成}
      SESSION_TTL_SECONDS: 28800
      AUTH_TRUSTED_ORIGINS: '["http://127.0.0.1:18080"]'
      REDIS_URL: redis://host.docker.internal:26379/0
      STORAGE_ENDPOINT: http://host.docker.internal:29000
      MILVUS_URI: http://host.docker.internal:29530
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 3s
      timeout: 6s
      retries: 20
  frontend:
    image: yugitalk-frontend:0.1.0
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 3s
      retries: 20
