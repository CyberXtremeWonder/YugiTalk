# 隔离的兼容性验证环境；这些凭证禁止用于正式环境。
name: yugitalk-stage0
services:
  postgres:
    image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    environment:
      POSTGRES_USER: probe
      POSTGRES_PASSWORD: probe-local-only
      POSTGRES_DB: probe
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U probe -d probe"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - type: bind
        source: ./data/stage0/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - type: bind
        source: ./data/stage0/redis
        target: /data
        bind:
          create_host_path: false
  setup:
    build:
      context: ./backend
      dockerfile: Dockerfile.probe
    image: yugitalk-stage0-probe:0.1.0
    environment: &probe-environment
      PROBE_DATABASE_URL: postgresql://probe:probe-local-only@postgres:5432/probe
      PROBE_REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "probes.worker"]
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    image: yugitalk-stage0-probe:0.1.0
    environment: *probe-environment
    depends_on:
      setup: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A probes.worker:queue inspect ping --timeout 3 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 10
  tests:
    image: yugitalk-stage0-probe:0.1.0
    profiles: ["test"]
    environment:
      <<: *probe-environment
      RUN_PROBE_INTEGRATION: "1"
    command: ["python", "-m", "pytest", "tests/test_stage_zero.py", "tests/test_api_contract.py", "tests/test_worker_integration.py", "-q", "-p", "no:cacheprovider"]
    depends_on:
      worker: {condition: service_healthy}
