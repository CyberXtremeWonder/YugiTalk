# 阶段 1 开发环境；生产发布与安全加固在阶段 6 独立验收。
# 开发容器自动命名为 yugitalk-dev-服务名-序号；公网隧道演示也沿用这组。
name: yugitalk-dev
x-backend: &backend
  image: yugitalk-backend:0.1.0
  environment: &environment
    APP_ENV: development
    DATABASE_URL: postgresql://yugitalk:dev-database-only@postgres:5432/yugitalk
    REDIS_URL: redis://redis:6379/0
    STORAGE_ENDPOINT: http://storage:9000
    STORAGE_ACCESS_KEY: dev-storage-user
    STORAGE_SECRET_KEY: dev-storage-password
    EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai_compatible}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
    EMBEDDING_REVISION: ${EMBEDDING_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
    EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
    EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embedding:8000/v1}
    EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-dev-embedding-key}
    EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-120}
    DOCUMENT_INDEX_TIMEOUT_SECONDS: ${DOCUMENT_INDEX_TIMEOUT_SECONDS:-1800}
    MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
    MODEL_ID: ${MODEL_ID:-mock-v1}
    MODEL_API_KEY: ${MODEL_API_KEY:-}
    MODEL_BASE_URL: ${MODEL_BASE_URL:-}
    MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-2}
    MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-30}
    MODEL_MAX_STREAM_BYTES: ${MODEL_MAX_STREAM_BYTES:-4194304}
    TOOL_HTTP_ALLOWED_HOSTS: '${TOOL_HTTP_ALLOWED_HOSTS:-[]}'
    TOOL_SECRETS: '${TOOL_SECRETS:-{}}'
    AMAP_API_KEY: ${AMAP_API_KEY:-}
    TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-465}
    SMTP_TLS: ${SMTP_TLS:-ssl}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_SENDER: ${SMTP_SENDER:-}
    # 七步 RAG：角色沿用当前模型协议，重排默认关闭。
    RAG_TIMEOUT_SECONDS: ${RAG_TIMEOUT_SECONDS:-60}
    RAG_PARALLEL_QUERIES: ${RAG_PARALLEL_QUERIES:-4}
    RAG_FAST_MODEL: ${RAG_FAST_MODEL:-}
    RAG_FAST_API_KEY: ${RAG_FAST_API_KEY:-}
    RAG_GRAPH_ENABLED: ${RAG_GRAPH_ENABLED:-true}
    RAG_GRADER_MODEL: ${RAG_GRADER_MODEL:-}
    RAG_GRADER_API_KEY: ${RAG_GRADER_API_KEY:-}
    RAG_CANDIDATE_LIMIT: ${RAG_CANDIDATE_LIMIT:-24}
    RAG_CONTEXT_CHARACTERS: ${RAG_CONTEXT_CHARACTERS:-5000}
    RAG_MERGE_RATIO: ${RAG_MERGE_RATIO:-0.5}
    RAG_HITL_TTL_SECONDS: ${RAG_HITL_TTL_SECONDS:-1800}
    RAG_RERANK_URL: ${RAG_RERANK_URL:-}
    RAG_RERANK_MODEL: ${RAG_RERANK_MODEL:-}
    RAG_RERANK_API_KEY: ${RAG_RERANK_API_KEY:-}
    RAG_RERANK_TIMEOUT_SECONDS: ${RAG_RERANK_TIMEOUT_SECONDS:-3}
    RAG_RERANK_MAX_CHARACTERS: ${RAG_RERANK_MAX_CHARACTERS:-12000}
    RAG_RERANK_FAILURE_THRESHOLD: ${RAG_RERANK_FAILURE_THRESHOLD:-3}
    RAG_RERANK_COOLDOWN_SECONDS: ${RAG_RERANK_COOLDOWN_SECONDS:-30}
    TASK_QUEUE: yugitalk
    RUN_LEASE_SECONDS: ${RUN_LEASE_SECONDS:-45}
    RECOVERY_INTERVAL_SECONDS: ${RECOVERY_INTERVAL_SECONDS:-5}
    RUN_MAX_ATTEMPTS: ${RUN_MAX_ATTEMPTS:-5}
    TASK_BUDGET_ENABLED: ${TASK_BUDGET_ENABLED:-false}
    CUMULATIVE_BUDGET_ENABLED: ${CUMULATIVE_BUDGET_ENABLED:-false}
    WORKSPACE_TOKEN_BUDGET: ${WORKSPACE_TOKEN_BUDGET:-100000}
    USER_TOKEN_BUDGET: ${USER_TOKEN_BUDGET:-100000}
    WORKSPACE_CONCURRENCY: ${WORKSPACE_CONCURRENCY:-4}
    USER_CONCURRENCY: ${USER_CONCURRENCY:-2}
    RUN_EVENT_LIMIT: ${RUN_EVENT_LIMIT:-1000}
    RUN_EVENT_RETENTION_SECONDS: ${RUN_EVENT_RETENTION_SECONDS:-86400}
    MILVUS_URI: http://milvus:19530
    MILVUS_DATABASE: default
    SESSION_SECRET: ${SESSION_SECRET:-dev-session-key-not-for-production}
    SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
    # 与浏览器真实来源比较；不要填写容器内部服务地址。
    AUTH_TRUSTED_ORIGINS: '${AUTH_TRUSTED_ORIGINS:-["http://127.0.0.1:8080","http://localhost:8080","http://127.0.0.1:18000"]}'
  init: true
  stop_grace_period: 30s
services:
  embedding:
    profiles: [local-embedding]
    image: yugitalk-embedding:0.1.0
    build:
      context: .
      dockerfile: embedding/Dockerfile
    labels:
      io.yugitalk.project: yugitalk
    environment:
      BGE_MODEL_PATH: /models
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-dev-embedding-key}
      BGE_DEVICE: auto
      OMP_NUM_THREADS: 4
    volumes:
      - type: bind
        source: ${BGE_MODEL_PATH:-./.cache/models/models--BAAI--bge-m3}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:18081:8000"
    read_only: true
    tmpfs: [/tmp]
    init: true
    restart: unless-stopped
    mem_limit: 6g
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 10
  postgres:
    image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    environment:
      POSTGRES_DB: yugitalk
      POSTGRES_USER: yugitalk
      POSTGRES_PASSWORD: dev-database-only
    ports: ["127.0.0.1:25432:5432"]
    volumes:
      - type: bind
        source: ./data/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yugitalk -d yugitalk"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:26379:6379"]
    volumes:
      - type: bind
        source: ./data/redis
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  storage:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z@sha256:391d1d45fdbe79944cb6de9337b073864bb9ee38c4c24280bfb39572e925af08
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: dev-storage-user
      MINIO_ROOT_PASSWORD: dev-storage-password
    ports: ["127.0.0.1:29000:9000", "127.0.0.1:29001:9001"]
    volumes:
      - type: bind
        source: ./data/minio
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
  etcd:
    image: quay.io/coreos/etcd:v3.5.18@sha256:d0a641d5fbcc89678c931a61b7de7b8a1cf097149f135c9c73bc81d076a1494b
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: ["etcd", "-advertise-client-urls=http://etcd:2379", "-listen-client-urls", "http://0.0.0.0:2379", "--data-dir", "/etcd"]
    volumes:
      - type: bind
        source: ./data/etcd
        target: /etcd
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
  milvus:
    image: milvusdb/milvus:v2.5.14@sha256:c469d101d851b28ca3b3c41e617c7ab2a5cd26b1c2e4d1c6a1460b646ee39e4c
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: storage:9000
      MINIO_ACCESS_KEY_ID: dev-storage-user
      MINIO_SECRET_ACCESS_KEY: dev-storage-password
      MINIO_REGION: us-east-1
      MINIO_BUCKET_NAME: yugitalk-milvus
    ports: ["127.0.0.1:29530:19530", "127.0.0.1:29091:9091"]
    volumes:
      - type: bind
        source: ./data/milvus
        target: /var/lib/milvus
        bind:
          create_host_path: false
    depends_on:
      etcd: {condition: service_healthy}
      storage: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 20
  api:
    <<: *backend
    # 仅 API 声明一次构建；迁移与 Worker 复用同一镜像。
    build: ./backend
    command: ["python", "start.py", "--host", "0.0.0.0"]
    # 与本机开发 API 的 8000 分开，容器内部端口保持 8000。
    ports: ["127.0.0.1:${API_BIND_PORT:-18000}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      storage: {condition: service_healthy}
      milvus: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10
  worker:
    <<: *backend
    command: ["python", "start.py", "--mode", "worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      milvus: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app:celery_app inspect ping --destination=yugitalk@$$HOSTNAME --timeout=5"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s
  scheduler:
    <<: *backend
    command: ["python", "start.py", "--mode", "scheduler"]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import pathlib,time; p=pathlib.Path('/tmp/yugitalk-scheduler'); assert p.exists() and time.time()-p.stat().st_mtime<90"]
      interval: 20s
      timeout: 5s
      retries: 3
  frontend:
    build: ./frontend
    image: yugitalk-frontend:0.1.0
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10
