[project]
name = "yugitalk-backend"
version = "0.1.0"
description = "YugiTalk API, worker and compatibility probes"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "langgraph-checkpoint-postgres>=3,<4",
  "celery[redis]>=5.6,<6",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "httpx>=0.28,<1",
  "argon2-cffi>=25,<26",
  "boto3>=1.40,<2",
  "pypdf>=6,<7",
  "prometheus-client>=0.22,<1",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "datasets==3.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "cryptography>=45,<50",
    "pip-audit>=2.9,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires the isolated stage-zero Compose services"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "start.py", "probes"]

# Celery 未提供类型标记；只豁免其第三方导入，自有代码仍执行严格类型检查。
[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

# S3 SDK 未带内联类型，仅豁免第三方包。
[[tool.mypy.overrides]]
module = ["boto3", "botocore", "botocore.*", "resource"]
ignore_missing_imports = true

# 本地嵌入模型只安装在独立推理服务中，API 不重复安装大型模型依赖。
[[tool.mypy.overrides]]
module = ["sentence_transformers"]
ignore_missing_imports = true
