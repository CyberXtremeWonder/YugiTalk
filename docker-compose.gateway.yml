# 与开发 Compose 合并：仅用于本机承载、云端提供 HTTPS 的受控演示。
# 公网演示前在私有 .env 设置独立 SESSION_SECRET，不复用默认值。
x-gateway-auth: &gateway-auth
  # 本机开发和公网演示共用账号数据，只放行明确的可信入口。
  AUTH_TRUSTED_ORIGINS: '["https://yugiagent.fun","http://127.0.0.1:8080","http://localhost:8080","http://127.0.0.1:5173","http://localhost:5173","http://127.0.0.1:8000","http://127.0.0.1:18000"]'
services:
  api:
    environment: *gateway-auth
  worker:
    environment: *gateway-auth
  scheduler:
    environment: *gateway-auth
  frontend:
    volumes:
      - ./deploy/tencent/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
