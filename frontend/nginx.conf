# 静态页面与 API 同源，SSE 所需的流式代理行为预先保留。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 原文上传与后端 20 MB 上限一致。
    client_max_body_size 20m;
    # 页面再加一层浏览器限制：脚本和连接同源，禁止图片请求与嵌入对象。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'none'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # API 重建后容器 IP 可能变化，使用 Docker DNS 定期重新解析。
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_endpoint http://api:8000;
    location / { try_files $uri $uri/ /index.html; }
    location /health/ {
        proxy_pass $api_endpoint;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass $api_endpoint;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
